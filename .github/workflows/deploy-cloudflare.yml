name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: multipliers-os-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Build
        run: npm run build

      - name: Check
        run: npm run check

      - name: Patch Cloudflare config
        run: node scripts/patch-wrangler-config.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}

      - name: Apply D1 migrations
        run: npx --yes wrangler@latest d1 migrations apply DB --remote --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npx --yes wrangler@latest deploy --config wrangler.jsonc
        env:
          FUNCTION_ROUTES_JSON: ${{ secrets.FUNCTION_ROUTES_JSON }}
          TEAM1_MANAGERS_JSON: ${{ secrets.TEAM1_MANAGERS_JSON }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set required runtime secrets
        run: |
          printf '%s' "$ADMIN_EMAILS" | npx --yes wrangler@latest secret put ADMIN_EMAILS --config wrangler.jsonc
          printf '%s' "$ORG_EMAIL_DOMAIN" | npx --yes wrangler@latest secret put ORG_EMAIL_DOMAIN --config wrangler.jsonc
          printf '%s' "$GMAIL_SENDER" | npx --yes wrangler@latest secret put GMAIL_SENDER --config wrangler.jsonc
          printf '%s' "$FUNCTION_ROUTES_JSON" | npx --yes wrangler@latest secret put FUNCTION_ROUTES_JSON --config wrangler.jsonc
          printf '%s' "$TEAM1_MANAGERS_JSON" | npx --yes wrangler@latest secret put TEAM1_MANAGERS_JSON --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          ORG_EMAIL_DOMAIN: ${{ secrets.ORG_EMAIL_DOMAIN }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          FUNCTION_ROUTES_JSON: ${{ secrets.FUNCTION_ROUTES_JSON }}
          TEAM1_MANAGERS_JSON: ${{ secrets.TEAM1_MANAGERS_JSON }}

      - name: Set test access secret when available
        run: |
          if [ -n "$TEST_AUTH_KEY" ]; then
            printf '%s' "$TEST_AUTH_KEY" | npx --yes wrangler@latest secret put TEST_AUTH_KEY --config wrangler.jsonc
          else
            echo "Skipping TEST_AUTH_KEY; temporary test login will stay disabled."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TEST_AUTH_KEY: ${{ secrets.TEST_AUTH_KEY }}

      - name: Set Gmail OAuth secrets when available
        run: |
          if [ -n "$GMAIL_CLIENT_ID" ] && [ -n "$GMAIL_CLIENT_SECRET" ] && [ -n "$GMAIL_REFRESH_TOKEN" ]; then
            printf '%s' "$GMAIL_CLIENT_ID" | npx --yes wrangler@latest secret put GMAIL_CLIENT_ID --config wrangler.jsonc
            printf '%s' "$GMAIL_CLIENT_SECRET" | npx --yes wrangler@latest secret put GMAIL_CLIENT_SECRET --config wrangler.jsonc
            printf '%s' "$GMAIL_REFRESH_TOKEN" | npx --yes wrangler@latest secret put GMAIL_REFRESH_TOKEN --config wrangler.jsonc
          else
            echo "Skipping Gmail OAuth secrets; email sending is disabled until they are configured."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
